name: scan
on:
  schedule:
    - cron: "*/10 4-10 * * 1-5"   # every ~10 min, 09:30-16:00 IST, Mon-Fri (GitHub may delay runs)
  workflow_dispatch: {}            # lets you press "Run workflow" manually

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas requests
      - name: Scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python signal_bot.py --once
      - name: Save signals.json
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add signals.json
          git diff --cached --quiet || (git commit -m "update signals" && git push)
